name: Build Editor de PDF - Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar executavel portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Editor-de-PDF" `
            --icon "assets/editor_pdf_icon.ico" `
            --add-data "assets/capa_padrao.png;assets" `
            --add-data "assets/editor_pdf_icon.png;assets" `
            --collect-all PySide6 `
            main.py

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item "dist/Editor-de-PDF.exe" "pacote/Editor-de-PDF.exe"
          Copy-Item "assets/capa_padrao.png" "pacote/CAPA-PADRAO.png"
          Copy-Item "README.md" "pacote/README.md"
          Compress-Archive -Path "pacote/*" -DestinationPath "Editor-de-PDF-Windows-Portable-v0.2.0.zip" -Force

      # IMPORTANTE: nao usa actions/upload-artifact.
      # Assim evita o erro "Artifact storage quota has been hit".
      - name: Publicar diretamente no Release v0.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.0"
          $arquivo = "Editor-de-PDF-Windows-Portable-v0.2.0.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $arquivo --clobber
          }
          else {
            gh release create $tag $arquivo `
              --title "Editor de PDF v0.2.0" `
              --notes "Versao Windows Portable v0.2.0 com novo layout moderno e acessivel, tema escuro, faixa horizontal de miniaturas, arrastar e soltar imagens/PDFs, icone moderno, capa sem corte e PDF com altura automatica. Publicacao direta em Releases, sem Artifacts."
          }
