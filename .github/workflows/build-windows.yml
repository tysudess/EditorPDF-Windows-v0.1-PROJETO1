name: Build Editor de PDF - Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "patch_v023.py"
      - "requirements.txt"
      - "assets/**"
      - "README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Aplicar ajuste fino v0.2.3
        shell: pwsh
        run: |
          python patch_v023.py
          python -m py_compile main.py

      - name: Atualizar main.py no repositorio
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Aplica ajuste fino do layout Windows v0.2.3"
            git push
          }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar executavel portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Editor-de-PDF" `
            --icon "assets/editor_pdf_icon.ico" `
            --add-data "assets/capa_padrao.png;assets" `
            --add-data "assets/editor_pdf_icon.png;assets" `
            --collect-all PySide6 `
            main.py

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item "dist/Editor-de-PDF.exe" "pacote/Editor-de-PDF.exe"
          Copy-Item "assets/capa_padrao.png" "pacote/CAPA-PADRAO.png"
          Copy-Item "README.md" "pacote/README.md"
          Compress-Archive -Path "pacote/*" -DestinationPath "Editor-de-PDF-Windows-Portable-v0.2.3.zip" -Force

      - name: Publicar diretamente no Release v0.2.3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.3"
          $arquivo = "Editor-de-PDF-Windows-Portable-v0.2.3.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $arquivo --clobber
          }
          else {
            gh release create $tag $arquivo `
              --title "Editor de PDF v0.2.3" `
              --notes "Windows Portable v0.2.3 com ajuste fino geral de layout: pre-visualizacao passa a encaixar a pagina inteira com melhor aproveitamento vertical; coluna Acoes fica mais larga e compacta; controles de edicao ficam legiveis; configuracoes e faixa de miniaturas foram refinadas. Mantidos Ctrl+Z, drag & drop, capa sem corte, icone moderno e publicacao direta em Releases."
          }
