name: Build Editor de PDF - Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source_v022/**"
      - "prepare_source.py"
      - "requirements.txt"
      - "assets/**"
      - "README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Reconstruir fonte v0.2.2
        shell: pwsh
        run: |
          python prepare_source.py
          python -m py_compile main.py

      - name: Atualizar main.py no repositorio
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Aplica fonte Windows v0.2.2"
            git push
          }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar executavel portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Editor-de-PDF" `
            --icon "assets/editor_pdf_icon.ico" `
            --add-data "assets/capa_padrao.png;assets" `
            --add-data "assets/editor_pdf_icon.png;assets" `
            --collect-all PySide6 `
            main.py

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item "dist/Editor-de-PDF.exe" "pacote/Editor-de-PDF.exe"
          Copy-Item "assets/capa_padrao.png" "pacote/CAPA-PADRAO.png"
          Copy-Item "README.md" "pacote/README.md"
          Compress-Archive -Path "pacote/*" -DestinationPath "Editor-de-PDF-Windows-Portable-v0.2.2.zip" -Force

      - name: Publicar diretamente no Release v0.2.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.2"
          $arquivo = "Editor-de-PDF-Windows-Portable-v0.2.2.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $arquivo --clobber
          }
          else {
            gh release create $tag $arquivo `
              --title "Editor de PDF v0.2.2" `
              --notes "Windows Portable v0.2.2: toda a area de pre-visualizacao fica livre para o corte. Selecionar/remover recorte, girar para esquerda/direita e excluir pagina foram movidos para o painel Acoes. Mantido Ctrl+Z, drag & drop, icone, capa sem corte e publicacao direta em Releases."
          }
