name: Build Editor de PDF - Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "patch_v031.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Aplicar layout aprovado v0.3.1
        shell: pwsh
        run: |
          python patch_v031.py
          python -m py_compile main.py

      - name: Atualizar fontes no repositorio
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Aplica layout aprovado Windows v0.3.1"
            git push
          }

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar executavel portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Editor-de-PDF" `
            --icon "assets/editor_pdf_icon.ico" `
            --add-data "assets/capa_padrao.png;assets" `
            --add-data "assets/editor_pdf_icon.png;assets" `
            --collect-all PySide6 `
            main.py

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item "dist/Editor-de-PDF.exe" "pacote/Editor-de-PDF.exe"
          Copy-Item "assets/capa_padrao.png" "pacote/CAPA-PADRAO.png"
          Copy-Item "README.md" "pacote/README.md"
          Compress-Archive -Path "pacote/*" -DestinationPath "Editor-de-PDF-Windows-Portable-v0.3.1.zip" -Force

      - name: Publicar diretamente no Release v0.3.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.1"
          $arquivo = "Editor-de-PDF-Windows-Portable-v0.3.1.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $arquivo --clobber
          }
          else {
            gh release create $tag $arquivo `
              --title "Editor de PDF v0.3.1" `
              --notes "Windows Portable v0.3.1 com layout reproduzido conforme a previa aprovada: bloco de dica removido, PAGINAS alinhado com a pre-visualizacao, coluna esquerda ampliada e ferramentas de edicao refeitas em cards quadrados com icones vetoriais maiores e sem sobreposicao. Mantidos zoom, Ajustar, Ctrl+Z, drag & drop e capa sem corte."
          }
