name: Build Editor de PDF - Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main_v021.py"
      - "main.py"
      - "requirements.txt"
      - "assets/**"
      - "build-windows.bat"
      - "README.md"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar executavel portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Editor-de-PDF" `
            --icon "assets/editor_pdf_icon.ico" `
            --add-data "assets/capa_padrao.png;assets" `
            --add-data "assets/editor_pdf_icon.png;assets" `
            --collect-all PySide6 `
            main_v021.py

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item "dist/Editor-de-PDF.exe" "pacote/Editor-de-PDF.exe"
          Copy-Item "assets/capa_padrao.png" "pacote/CAPA-PADRAO.png"
          Copy-Item "README.md" "pacote/README.md"
          Compress-Archive -Path "pacote/*" -DestinationPath "Editor-de-PDF-Windows-Portable-v0.2.1.zip" -Force

      - name: Publicar diretamente no Release v0.2.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.1"
          $arquivo = "Editor-de-PDF-Windows-Portable-v0.2.1.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $arquivo --clobber
          }
          else {
            gh release create $tag $arquivo `
              --title "Editor de PDF v0.2.1" `
              --notes "Versao Windows Portable v0.2.1 com ferramentas de recorte fora da area de pre-visualizacao e Ctrl+Z para desfazer recorte, remocao de recorte, giro e exclusao. Mantem layout moderno, drag & drop, icone, capa sem corte e publicacao direta em Releases."
          }
